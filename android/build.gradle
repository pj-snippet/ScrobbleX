// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// This file is normally generated by `npx cap sync android`. Create an empty
// fallback before subprojects are evaluated when no Cordova plugins exist.
def cordovaVariablesFile = file("capacitor-cordova-android-plugins/cordova.variables.gradle")
if (!cordovaVariablesFile.exists()) {
    cordovaVariablesFile.parentFile.mkdirs()
    cordovaVariablesFile.text = "// No Cordova plugin variables are configured.\n"
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
